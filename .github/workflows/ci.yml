name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test (Linux, virtual display for the Swing tests)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B test
      - name: Test
        if: runner.os != 'Linux'
        run: mvn -B test
      - name: Overlay simulator (100k nodes)
        if: runner.os == 'Linux'
        run: mvn -B -q compile && java -cp target/classes com.kartikey.p2pchat.conf.overlay.OverlaySim nodes=100000
